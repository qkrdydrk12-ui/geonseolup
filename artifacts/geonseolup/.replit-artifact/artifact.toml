kind = "web"
previewPath = "/"
title = "건설UP - 건설 현장 일자리 정보"
version = "1.0.0"
id = "artifacts/geonseolup"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19759

[services.development]
run = "pnpm --filter @workspace/geonseolup run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/geonseolup", "run", "build" ]
publicDir = "artifacts/geonseolup/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19759"
BASE_PATH = "/"
